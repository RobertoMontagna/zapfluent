version: "2"

linters:
  default: standard

  settings:
    gocyclo:
      min-complexity: 7
    revive:
      rules:
        - name: line-length-limit
          severity: warning
          arguments: [ 100 ]
    staticcheck:
      checks: [ "all", "-ST1000" ]

formatters:
  enable:
    - gci

  settings:
    gci:
      # The `sections` option defines the order of import blocks.
      sections:
        - standard
        - default
        - prefix(go.robertomontagna.dev)
        - prefix(go.robertomontagna.dev/zapfluent)
        - blank
        - dot
      # The `custom-order` option makes the section order the same as the order of `sections`.
      custom-order: true

run:
  # The default timeout is 1 minute, but we can increase it to avoid timeouts on larger projects.
  timeout: 3m

issues:
  excludeRules:
    # Exclude specific linter rules from test files where they are not critical.
    - path: "_test.go"
      linters:
        - revive
      text: "dot-imports|unused-parameter"
    - source: "^func Test"
      linters:
        - gocyclo
      text: "cyclomatic complexity"